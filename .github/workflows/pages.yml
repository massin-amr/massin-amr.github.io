name: Publier le portfolio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extraire le site vérifié
        run: |
          unzip -q portfolio.zip -d site
          test -s site/index.html
          test ! -e site/CV_Massin_Amrouni.pdf
          if find site -type f \( -iname '*.pdf' -o -iname '*.map' -o -iname '*.tsx' -o -iname '.env*' -o -iname '*.zip' \) | grep -q .; then
            echo 'Publication bloquée : fichier privé ou source dans le site.'
            exit 1
          fi
          if grep -RIlE --include='*.html' --include='*.js' --include='*.json' --include='*.rsc' 'mailto:|tel:[+0-9]|[[:alnum:]._%+-]+@gmail[.]com' site >/dev/null; then
            echo 'Publication bloquée : coordonnées personnelles dans le site.'
            exit 1
          fi
      - name: Préparer les fichiers de publication
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
